trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
- name: buildConfiguration
  value: 'Release'
- name: githubOwner
  value: 'POPWorldMedia'
# Holds GH_PACKAGES_TOKEN (secret): a GitHub classic PAT with write:packages and read:packages
- group: popblog-github-packages

steps:
# Must run before "dotnet build": static web assets are scanned during the build, so
# wwwroot/dist and wwwroot/lib have to be in place first. The Mvc project's
# BuildFrontendAssets target also runs "node build.js", so node_modules must exist regardless.
- task: UseNode@1
  displayName: 'Use Node.js'
  inputs:
    version: '24.x'

- script: |
    set -e
    npm install
    npm run build
  displayName: 'Build Mvc front-end assets'
  workingDirectory: 'src/PopBlog.Mvc'

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '10.0.x'

- task: NuGetToolInstaller@1
  inputs:
    versionSpec: '6.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: 'POPBlog.sln'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: 'POPBlog.sln'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- script: dotnet pack src/PopBlog.Mvc/PopBlog.Mvc.csproj --configuration $(buildConfiguration) --no-restore --version-suffix "pre.$(Build.BuildId)" --output $(Build.ArtifactStagingDirectory)
  displayName: 'Pack'

- script: |
    set -e
    dotnet nuget add source \
      --username $(githubOwner) \
      --password "$(GH_PACKAGES_TOKEN)" \
      --store-password-in-clear-text \
      --name github \
      "https://nuget.pkg.github.com/$(githubOwner)/index.json"
    dotnet nuget push "$(Build.ArtifactStagingDirectory)/**/*.nupkg" \
      --source github \
      --api-key "$(GH_PACKAGES_TOKEN)" \
      --skip-duplicate
  displayName: 'Push to GitHub Packages'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
