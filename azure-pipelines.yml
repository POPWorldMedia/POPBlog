trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:
# Must run before "dotnet build": static web assets are scanned during the build, so
# wwwroot/dist and wwwroot/lib have to be in place first. The Mvc project's
# BuildFrontendAssets target also runs "node build.js", so node_modules must exist regardless.
- task: UseNode@1
  displayName: 'Use Node.js'
  inputs:
    version: '24.x'

- script: |
    set -e
    npm install
    npm run build
  displayName: 'Build Mvc front-end assets'
  workingDirectory: 'src/PopBlog.Mvc'

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '10.0.x'

- task: NuGetToolInstaller@1
  inputs:
    versionSpec: '6.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: 'POPBlog.sln'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: 'POPBlog.sln'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- script: dotnet pack src/PopBlog.Mvc/PopBlog.Mvc.csproj --configuration $(buildConfiguration) --no-restore --version-suffix "pre.$(Build.BuildId)" --output $(Build.ArtifactStagingDirectory)
  displayName: 'Pack'

- script: dotnet nuget push "$(Build.ArtifactStagingDirectory)/**/*.nupkg" --source https://nuget.pkg.github.com/POPWorldMedia/index.json --api-key $(GITHUB_TOKEN) --skip-duplicate
  displayName: 'Push to GitHub Packages'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
